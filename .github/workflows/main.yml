name: Frostsoulx Audio Engine

on:
  push:
    branches:
      - main
      - genspark_ai_developer
  pull_request:
    branches:
      - main
      - genspark_ai_developer
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:

  # ==========================================
  # HOST BUILD + TEST
  # ==========================================
  host-build:
    name: Host Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . \
            -B build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DFROSTSOULX_BUILD_PLUGIN=ON \
            -DFROSTSOULX_BUILD_TESTS=ON

      - name: Build Engine
        run: |
          cmake --build build-host \
            --config Release \
            --parallel 2

      - name: Run Tests
        run: |
          cd build-host
          ctest --output-on-failure

  # ==========================================
  # ANDROID ARM64
  # ==========================================
  android-arm64:
    name: Android ARM64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK_PATH=""
          if [ -d "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" ]; then
            NDK_PATH="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_HOME"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "Installing NDK ${{ env.NDK_VERSION }} via sdkmanager..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"
            NDK_PATH="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          fi
          echo "Selected Android NDK: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Configure ARM64
        run: |
          cmake -S . \
            -B build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DFROSTSOULX_BUILD_PLUGIN=ON \
            -DFROSTSOULX_BUILD_TESTS=OFF

      - name: Build ARM64
        run: |
          cmake --build build-arm64 \
            --config Release \
            --parallel 2

      - name: Package ARM64
        run: |
          mkdir -p dist/arm64-v8a
          find build-arm64 -type f -name "*.so" -exec cp {} dist/arm64-v8a/ \;
          find dist -type f -exec sha256sum {} \;

      - name: Upload ARM64 Engine
        uses: actions/upload-artifact@v4
        with:
          name: frostsoulx-audio-engine-arm64-v8a
          path: dist/arm64-v8a/
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # ANDROID x86_64
  # ==========================================
  android-x86_64:
    name: Android x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          NDK_PATH=""
          if [ -d "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" ]; then
            NDK_PATH="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_HOME"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "Installing NDK ${{ env.NDK_VERSION }} via sdkmanager..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"
            NDK_PATH="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          fi
          echo "Selected Android NDK: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Configure x86_64
        run: |
          cmake -S . \
            -B build-x86_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-29 \
            -DFROSTSOULX_BUILD_PLUGIN=ON \
            -DFROSTSOULX_BUILD_TESTS=OFF

      - name: Build x86_64
        run: |
          cmake --build build-x86_64 \
            --config Release \
            --parallel 2

      - name: Package x86_64
        run: |
          mkdir -p dist/x86_64
          find build-x86_64 -type f -name "*.so" -exec cp {} dist/x86_64/ \;
          find dist -type f -exec sha256sum {} \;

      - name: Upload x86_64 Engine
        uses: actions/upload-artifact@v4
        with:
          name: frostsoulx-audio-engine-x86_64
          path: dist/x86_64/
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # COMBINED ENGINE PACKAGE
  # ==========================================
  package-engine:
    name: Package Audio Engine
    runs-on: ubuntu-latest
    needs:
      - android-arm64
      - android-x86_64

    steps:
      - name: Download ARM64
        uses: actions/download-artifact@v4
        with:
          name: frostsoulx-audio-engine-arm64-v8a
          path: package/lib/arm64-v8a

      - name: Download x86_64
        uses: actions/download-artifact@v4
        with:
          name: frostsoulx-audio-engine-x86_64
          path: package/lib/x86_64

      - name: Create manifest
        run: |
          cat > package/manifest.json <<'EOF'
          {
            "name": "Frostsoulx Audio Engine",
            "version": "1.0.0",
            "platform": "android",
            "architectures": [
              "arm64-v8a",
              "x86_64"
            ],
            "build_type": "Release"
          }
          EOF

      - name: Package ZIP
        run: |
          cd package
          zip -qr ../frostsoulx-audio-engine.zip .
          cd ..
          sha256sum frostsoulx-audio-engine.zip
          unzip -l frostsoulx-audio-engine.zip

      - name: Upload Final Engine
        uses: actions/upload-artifact@v4
        with:
          name: frostsoulx-audio-engine
          path: frostsoulx-audio-engine.zip
          if-no-files-found: error
          retention-days: 30
