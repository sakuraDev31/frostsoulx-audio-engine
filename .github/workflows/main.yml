name: Build Resonance

on:
  push:
    branches: [main,genspark ai developer]
  pull_request:
    branches: [main,genspark ai developer]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_CMAKE_VERSION: '3.22.1'

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Reference engine host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --upgrade numpy

      - name: Run host tests
        run: bash reference-engine/tools/run_host_tests.sh

  build-debug-apk:
    name: Build Resonance debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;${{ env.ANDROID_NDK_VERSION }}
            cmake;${{ env.ANDROID_CMAKE_VERSION }}
          accept-android-sdk-license: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: resonance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-engine-zip:
    name: Build compiled audio engine ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            ndk;${{ env.ANDROID_NDK_VERSION }}
            cmake;${{ env.ANDROID_CMAKE_VERSION }}
          accept-android-sdk-license: true
          log-accepted-android-sdk-licenses: false

      - name: Build engine for arm64-v8a and x86_64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          rm -rf pkg
          mkdir -p pkg

          for abi in arm64-v8a x86_64; do
            cmake -S reference-engine -B "build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$abi" --parallel
            mkdir -p "pkg/lib/$abi"
            cp "build-$abi/libref_engine.so" "pkg/lib/$abi/libref_engine.so"
          done

          cp reference-engine/manifest.json pkg/manifest.json
          (cd pkg && zip -qr ../resonance-reference-engine.zip .)
          unzip -l resonance-reference-engine.zip
          sha256sum resonance-reference-engine.zip

      - name: Upload compiled engine ZIP
        uses: actions/upload-artifact@v4
        with:
          name: resonance-reference-engine
          path: resonance-reference-engine.zip
          if-no-files-found: error
          retention-days: 14
